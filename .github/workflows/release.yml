name: Build & Release DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Package DMG
        run: |
          chmod +x build.sh package-dmg.sh
          ./package-dmg.sh

      - name: Create Release and Upload DMG
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/RazerDPI.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
